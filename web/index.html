<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Hybrid MAX</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 To-Do Hybrid MAX</h1>
            <p class="subtitle">Web Edition v1.0</p>
        </div>

        <div class="main">
            <div class="input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Dodaj nowe zadanie..."
                    class="task-input"
                >
                <button id="addBtn" class="btn btn-primary">➕ Dodaj</button>
                <button id="syncBtn" class="btn btn-secondary" title="Synchronizuj z Desktop">🔄 Sync</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">Wszystkie</button>
                <button class="filter-btn" data-filter="active">Aktywne</button>
                <button class="filter-btn" data-filter="completed">Ukończone</button>
            </div>

            <div id="taskList" class="task-list">
                <!-- Tasks będą tutaj -->
            </div>

            <div class="stats">
                <span id="taskCount">Zadań: 0</span>
                <button id="clearBtn" class="btn btn-danger">🗑️ Wyczyść</button>
            </div>
        </div>

        <div class="sync-status">
            <span id="syncStatus">Status: Gotowy</span>
            <span id="lastSync">Ostatnia sync: Nigdy</span>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="sync.js"></script>
    <script src="app.js"></script>
</body>
</html>
